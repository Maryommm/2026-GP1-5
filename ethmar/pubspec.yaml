name: ethmar
description: "Ethmar – a friendly Arabic/English gardening app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_fonts: ">=6.2.1 <9.0.0"
  cloud_firestore: ^6.10.0
  camera: ^0.12.1
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  # 12.x keeps permission_handler_android on 13.x (compileSdk 35); 13.x needs
  # compileSdk 37, above what this project builds with.
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App icon. After changing the images in assets/icon/, run:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  # Android 8+: the logo on a white layer, shaped by the phone (circle, etc.).
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # The foreground image already has its safe-zone margin built in.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  ios: false
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/ethmar_crops/
